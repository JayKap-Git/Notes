     tip:"NAT is a major reason IPv4 survived exhaustion. It breaks true end-to-end connectivity (a reason IPv6, with abundant addresses, reduces the need for it)."},
    {t:"What happens when you type a URL", h:"The end-to-end walkthrough interviewers love.",
     simple:"The full journey: (1) **DNS resolution** — browser resolves the domain to an IP (checking caches, then DNS servers). (2) **TCP connection** — a 3-way handshake to the server's IP on port 80/443. (3) **TLS handshake** if HTTPS — negotiate encryption. (4) **HTTP request** — browser sends <c>GET</c> for the page. (5) **Server responds** with HTML. (6) **Rendering** — browser parses HTML, fetches CSS/JS/images, builds the DOM, and paints the page.",
     ex:"Typing google.com: DNS → IP, TCP handshake, TLS, <c>GET /</c>, server returns HTML, browser renders and fires more requests for assets.",
     tip:"This one question touches **every** layer — DNS, TCP/IP, TLS, HTTP, routing, and rendering. Structure your answer as clear numbered steps; interviewers use it to probe breadth across the whole stack."},
  ]},
];

/* ============================================================
   RENDER + STATE
   ============================================================ */
const DONE = new Set();
let activeKey = SUBJECTS[0].key;
let query = "";
let storageOK = false;

const $ = s => document.querySelector(s);
const listEl = $("#list"), emptyEl = $("#empty"), searchEl = $("#search");
const modulesEl = $("#modules"), metaEl = $("#searchmeta");

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(s){
  let out = esc(s);
  out = out.replace(/&lt;c&gt;/g,'<code class="ic">').replace(/&lt;\/c&gt;/g,'</code>');
  out = out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  return out;
}
const idOf = (k,i) => k + "-" + i;

/* ---- Theme Toggle Listener ---- */
$("#themeToggle").addEventListener("click", () => {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const newTheme = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", newTheme);
  localStorage.setItem("theme", newTheme);
});

/* ---- storage (persist across sessions; graceful fallback) ---- */
async function loadProgress(){
  try{
    const saved = localStorage.getItem("cs_prep_done");
    if(saved){
      JSON.parse(saved).forEach(k => DONE.add(k));
    }
    storageOK = true;
  }catch(e){ storageOK = false; }
}
async function saveOne(id, done){
  if(!storageOK) return;
  try{
    localStorage.setItem("cs_prep_done", JSON.stringify(Array.from(DONE)));
  }catch(e){}
}
async function clearAllStorage(){
  if(!storageOK) return;
  try{ localStorage.removeItem("cs_prep_done"); }catch(e){}
}

/* ---- subject modules (nav) ---- */
function renderModules(){
  modulesEl.innerHTML = "";
  SUBJECTS.forEach(sub=>{
    const total = sub.topics.length;
    const done = sub.topics.filter((_,i)=>DONE.has(idOf(sub.key,i))).length;
    const pct = Math.round(done/total*100);
    const b = document.createElement("button");
    b.className = "module";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", sub.key===activeKey ? "true":"false");
    b.style.setProperty("--accent", sub.color);
    b.style.setProperty("--accent-wash", sub.wash);
    b.innerHTML =
      '<div class="m-top"><span class="m-name">'+sub.name+'</span><span class="m-pct">'+pct+'%</span></div>'+
      '<div class="bar"><span style="width:'+pct+'%"></span></div>'+
      '<span class="m-count">'+done+' / '+total+' revised</span>';
    b.addEventListener("click", ()=>{
      activeKey = sub.key;
      if(query){ searchEl.value=""; query=""; toggleClear(); }
      renderModules(); renderSubbar(); renderList();
      window.scrollTo({top:0, behavior:"smooth"});
    });
    modulesEl.appendChild(b);
  });
}

/* ---- sub-toolbar ---- */
function renderSubbar(){
  const sub = SUBJECTS.find(s=>s.key===activeKey);
  document.documentElement.style.setProperty("--accent", sub.color);
  document.documentElement.style.setProperty("--accent-wash", sub.wash);
  $("#subbar").style.setProperty("--accent", sub.color);
  $("#subbar").style.setProperty("--accent-wash", sub.wash);
  $("#subjectTitle").textContent = sub.name;
  $("#subjectDesc").textContent = sub.desc;
}

/* ---- topic card ---- */
function topicCard(sub, topic, i){
  const id = idOf(sub.key,i);
  const done = DONE.has(id);
  const el = document.createElement("article");
  el.className = "topic" + (done?" done":"");
  el.style.setProperty("--accent", sub.color);
  el.style.setProperty("--accent-wash", sub.wash);
  el.id = "topic-"+id;

  let body = '<div class="block"><div class="lbl">In simple words</div><p>'+fmt(topic.simple)+'</p></div>';
  body += '<div class="block"><div class="lbl">Example</div><p>'+fmt(topic.ex)+'</p></div>';
  if(topic.code){
    body += '<pre class="code">'+esc(topic.code).replace(/\/\/(.*)/g,'<span class="cm">//$1</span>')+'</pre>';
  }
  if(topic.tip){
    body += '<div class="block tip"><div class="lbl">Interview tip</div><p>'+fmt(topic.tip)+'</p></div>';
  }

  const badge = query ? '<span class="badge">'+sub.name+'</span>' : '';

  el.innerHTML =
    '<div class="t-head">'+
      '<span class="t-idx">'+String(i+1).padStart(2,"0")+'</span>'+
      '<div class="t-titles"><div class="t-title">'+esc(topic.t)+'</div>'+
        '<div class="t-hint">'+esc(topic.h)+'</div></div>'+
      '<div class="t-tools">'+badge+
        '<button class="chk" title="Mark revised" aria-label="Mark revised">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+
        '</button>'+
        '<span class="caret"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>'+
      '</div>'+
    '</div>'+
    '<div class="t-body"><div class="t-body-inner">'+body+'</div></div>';

  const head = el.querySelector(".t-head");
  const bodyEl = el.querySelector(".t-body");
  const chk = el.querySelector(".chk");

  head.addEventListener("click", e=>{
    if(e.target.closest(".chk") || e.target.closest(".chk svg") || e.target.closest(".chk path")) return;
    const open = el.classList.toggle("open");
    bodyEl.style.maxHeight = open ? bodyEl.scrollHeight + "px" : "0";
  });
  chk.addEventListener("click", e=>{
    e.stopPropagation();
    const nowDone = !el.classList.contains("done");
    el.classList.toggle("done", nowDone);
    if(nowDone) DONE.add(id); else DONE.delete(id);
    saveOne(id, nowDone);
    renderModules();
  });
  return el;
}

/* ---- list ---- */
function matches(topic){
  if(!query) return true;
  const q = query.toLowerCase();
  return (topic.t+" "+topic.h+" "+topic.simple+" "+topic.ex+" "+(topic.tip||"")).toLowerCase().includes(q);
}
function renderList(){
  listEl.innerHTML = "";
  let shown = 0;

  if(query){
    metaEl.style.display = "block";
    SUBJECTS.forEach(sub=>{
      sub.topics.forEach((t,i)=>{
        if(matches(t)){ listEl.appendChild(topicCard(sub,t,i)); shown++; }
      });
    });
    metaEl.innerHTML = shown
      ? 'Found <b>'+shown+'</b> topic'+(shown>1?"s":"")+' matching "<b>'+esc(query)+'</b>" across all subjects'
      : '';
  }else{
    metaEl.style.display = "none";
    const sub = SUBJECTS.find(s=>s.key===activeKey);
    sub.topics.forEach((t,i)=>{ listEl.appendChild(topicCard(sub,t,i)); shown++; });
  }

  emptyEl.style.display = shown ? "none" : "block";
  if(!shown){
    emptyEl.innerHTML = '<b>No topics matched</b>Try a different keyword — e.g. deadlock, normalization, TCP, polymorphism.';
  }
}

/* ---- expand / collapse all (visible) ---- */
function setAll(open){
  document.querySelectorAll(".topic").forEach(el=>{
    const b = el.querySelector(".t-body");
    el.classList.toggle("open", open);
    b.style.maxHeight = open ? b.scrollHeight + "px" : "0";
  });
}
$("#expandAll").addEventListener("click", ()=>setAll(true));
$("#collapseAll").addEventListener("click", ()=>setAll(false));

$("#resetProg").addEventListener("click", async ()=>{
  if(!confirm("Clear all revision progress on this device?")) return;
  DONE.clear();
  await clearAllStorage();
  renderModules(); renderList();
});

/* ---- search ---- */
function toggleClear(){ $("#clearbtn").style.display = searchEl.value ? "block":"none"; }
searchEl.addEventListener("input", ()=>{ query = searchEl.value.trim(); toggleClear(); renderList(); });
searchEl.addEventListener("keydown", e=>{ if(e.key==="Escape"){ searchEl.value=""; query=""; toggleClear(); renderList(); searchEl.blur(); }});
$("#clearbtn").addEventListener("click", ()=>{ searchEl.value=""; query=""; toggleClear(); renderList(); searchEl.focus(); });
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==searchEl){ e.preventDefault(); searchEl.focus(); }
});

/* ---- init ---- */
(async function init(){
  await loadProgress();
  renderModules();
  renderSubbar();
  renderList();
})();
</script>
</body>
</html>
